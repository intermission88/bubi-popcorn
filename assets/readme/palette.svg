<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Palet warna: hitam, putih, emas, biru untuk Zald, pink untuk Micel">
  <rect width="1200" height="210" rx="20" fill="#0a0a0a"/>
  <g font-family="'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <g transform="translate(40 36)">
      <rect width="196" height="96" rx="16" fill="#000" stroke="#3f3f46"/>
      <text x="98" y="164" font-size="17" font-weight="700" fill="#fafafa">Hitam</text>
      <text x="98" y="140" font-size="13" fill="#a3a3a3" letter-spacing="1">#000000</text>
    </g>
    <g transform="translate(260 36)">
      <rect width="196" height="96" rx="16" fill="#fafafa"/>
      <text x="98" y="164" font-size="17" font-weight="700" fill="#fafafa">Putih</text>
      <text x="98" y="140" font-size="13" fill="#a3a3a3" letter-spacing="1">#FAFAFA</text>
    </g>
    <g transform="translate(480 36)">
      <rect width="196" height="96" rx="16" fill="#facc15"/>
      <text x="98" y="164" font-size="17" font-weight="700" fill="#facc15">Emas</text>
      <text x="98" y="140" font-size="13" fill="#a3a3a3" letter-spacing="1">#FACC15</text>
    </g>
    <g transform="translate(700 36)">
      <rect width="196" height="96" rx="16" fill="#38bdf8"/>
      <text x="98" y="164" font-size="17" font-weight="700" fill="#38bdf8">Biru · Zald</text>
      <text x="98" y="140" font-size="13" fill="#a3a3a3" letter-spacing="1">#38BDF8</text>
    </g>
    <g transform="translate(920 36)">
      <rect width="196" height="96" rx="16" fill="#f472b6"/>
      <text x="98" y="164" font-size="17" font-weight="700" fill="#f472b6">Pink · Micel</text>
      <text x="98" y="140" font-size="13" fill="#a3a3a3" letter-spacing="1">#F472B6</text>
    </g>
  </g>
</svg>
